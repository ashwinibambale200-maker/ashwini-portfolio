<!-- =========================================
   CONTACT SECTION
========================================= -->
<section id="contact" class="contact-section">
  <div class="contact-wrapper">
    
    <div class="contact-header" data-aos="fade-up">
      <h2>Get In Touch</h2>
      <p>Have a question or want to work together? Feel free to drop a message!</p>
    </div>

    <div class="contact-container" data-aos="fade-up" data-aos-delay="100">

      <!-- Left: Contact Info & Map -->
      <div class="contact-info">
        
        <div class="info-box">
          <div class="info-icon">
            <i class="fas fa-map-marker-alt"></i>
          </div>
          <div>
            <h4>Address</h4>
            <p>Mulund East, Mumbai – 400081, Maharashtra, India</p>
          </div>
        </div>

        <div class="info-box">
          <div class="info-icon">
            <i class="fas fa-envelope"></i>
          </div>
          <div>
            <h4>Email Us</h4>
            <p><a href="mailto:ashwinibambale200@gmail.com">ashwinibambale200@gmail.com</a></p>
          </div>
        </div>

        <!-- Google Map -->
        <div class="map-container">
          <iframe src="https://www.google.com/maps?q=Mulund+East+Mumbai+India&output=embed" width="100%" height="220" frameborder="0" style="border:0;" allowfullscreen loading="lazy"></iframe>
        </div>

      </div>

      <!-- Right: Contact Form -->
      <div class="contact-form-wrapper">
        <form action="https://formspree.io/f/xjkeaovb" method="POST">
          <div class="form-row">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
          </div>
          <input type="text" name="subject" placeholder="Subject" required class="form-input-full">
          <textarea name="message" rows="6" placeholder="Message" required class="form-input-full"></textarea>
          <button type="submit" class="submit-btn">
            <span>Send Message</span>
            <i class="fas fa-paper-plane"></i>
          </button>
        </form>
      </div>

    </div>
  </div>
</section>
